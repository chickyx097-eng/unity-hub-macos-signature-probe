name: unity-hub-macos-signature-check
on: workflow_dispatch

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: System info
        run: |
          sw_vers
          uname -a

      - name: Download real Unity Hub (arm64)
        run: |
          curl -L -o UnityHubSetup-arm64.dmg "https://public-cdn.cloud.unity3d.com/hub/prod/UnityHubSetup-arm64.dmg"
          ls -la UnityHubSetup-arm64.dmg
          shasum -a 256 UnityHubSetup-arm64.dmg

      - name: Mount DMG and install Hub
        run: |
          hdiutil attach UnityHubSetup-arm64.dmg -nobrowse -mountpoint /Volumes/UnityHub
          ls -la /Volumes/UnityHub
          cp -R "/Volumes/UnityHub/Unity Hub.app" /Applications/
          hdiutil detach /Volumes/UnityHub
          codesign -dv --verbose=4 "/Applications/Unity Hub.app" || true

      - name: Locate app.asar and relevant editorUtils source
        run: |
          find "/Applications/Unity Hub.app" -name "app.asar" -o -iname "*editorUtils*"
          npm install -g @electron/asar 2>&1 | tail -5 || npm install -g asar 2>&1 | tail -5

      - name: Extract asar
        run: |
          ASAR_PATH=$(find "/Applications/Unity Hub.app" -name "app.asar" | head -1)
          echo "ASAR_PATH=$ASAR_PATH"
          mkdir -p extracted_asar
          npx @electron/asar extract "$ASAR_PATH" extracted_asar || npx asar extract "$ASAR_PATH" extracted_asar
          echo "---- searching for editor signature/verification logic ----"
          grep -rli "codesign\|verifySignature\|CompanyName\|signature" extracted_asar --include=*.js | head -50

      - name: Dump candidate verification files
        run: |
          for f in $(grep -rli "codesign\|verifySignature\|signature" extracted_asar --include=*.js | grep -i "editor\|verif\|signatur" | head -10); do
            echo "===== $f ====="
            cat "$f"
            echo
          done

      - name: Upload extracted source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-hub-source
          path: extracted_asar
          retention-days: 7

      - name: Build a trivially forged "Unity Editor" unsigned binary
        run: |
          mkdir -p ForgedEditor.app/Contents/MacOS
          cat > ForgedEditor.app/Contents/MacOS/Unity << 'EOF'
          #!/bin/bash
          echo "THIS IS A FORGED, UNSIGNED BINARY PRETENDING TO BE THE UNITY EDITOR"
          echo "argv: $@"
          EOF
          chmod +x ForgedEditor.app/Contents/MacOS/Unity
          cat > ForgedEditor.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Unity</string>
            <key>CFBundleIdentifier</key><string>com.unity3d.UnityEditor5.x</string>
            <key>CFBundleName</key><string>Unity</string>
            <key>CFBundleShortVersionString</key><string>2022.3.50f1</string>
          </dict>
          </plist>
          EOF
          codesign -dv --verbose=4 ForgedEditor.app 2>&1 || echo "CONFIRMED: forged app.app is UNSIGNED (no Developer ID), exactly like the Windows forged .exe in the original report"
          spctl --assess --type execute ForgedEditor.app 2>&1 || echo "CONFIRMED: Gatekeeper REJECTS the unsigned forged app by default"
