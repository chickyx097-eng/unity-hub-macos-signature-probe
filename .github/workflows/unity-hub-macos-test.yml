name: macos-codesign-check
on: workflow_dispatch

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: System info
        run: |
          sw_vers
          uname -m

      - name: Write validator (same logic as editorUtils_darwin validateEditorFile, default path)
        run: |
          cat > "$RUNNER_TEMP/hubcheck.js" << 'EOF'
          const { execFile } = require('child_process');
          const util = require('util');
          const ef = util.promisify(execFile);
          (async () => {
            const editorPath = process.argv[2];
            let fields = [];
            try {
              const { stderr } = await ef('/usr/bin/codesign', ['-dvvv', editorPath]);
              fields = stderr.split('\n');
            } catch (e) {
              console.log('HUB VERDICT: REJECT (ERROR.FAILED_LICENSE_INFO)');
              return;
            }
            let executable = '', identifier = '', developer = '';
            for (const line of fields) if (line.startsWith('Executable')) executable = line;
            else if (line.startsWith('Identifier')) identifier = line;
            else if (line.startsWith('Authority=Developer ID Application:')) developer = line;
            if (!executable.includes(`${editorPath}/Contents/MacOS/Unity`) || !identifier.includes('com.unity3d.UnityEditor')) console.log('HUB VERDICT: REJECT (ERROR.NOT_AN_UNITY_APP)');
            else if (fields.length === 2 || !developer.includes('Unity Technologies')) console.log('HUB VERDICT: REJECT (ERROR.NOT_SIGNED)');
            else console.log('HUB VERDICT: ACCEPT (validateEditorFile returns true)');
          })();
          EOF

      - name: Build three test bundles
        run: |
          set -x
          cd "$RUNNER_TEMP"
          cat > u.c << 'EOF'
          #include <stdio.h>
          int main(void){ puts("FORGED EDITOR EXECUTED - not built or signed by Unity"); return 0; }
          EOF
          for c in caseA_unsigned caseB_adhoc caseC_selfsigned; do
            mkdir -p "$c/Unity.app/Contents/MacOS"
            clang -o "$c/Unity.app/Contents/MacOS/Unity" u.c
            cat > "$c/Unity.app/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Unity</string>
            <key>CFBundleIdentifier</key><string>com.unity3d.UnityEditor5.x</string>
            <key>CFBundleName</key><string>Unity</string>
            <key>CFBundleVersion</key><string>2022.3.50f1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict>
          </plist>
          EOF
          done
          codesign --remove-signature caseA_unsigned/Unity.app/Contents/MacOS/Unity || true
          codesign --force -s - --identifier com.unity3d.UnityEditor5.x caseB_adhoc/Unity.app

      - name: Create self-signed certificate with a Unity-like name and sign case C
        run: |
          set -x
          cd "$RUNNER_TEMP"
          cat > cert.cnf << 'EOF'
          [req]
          distinguished_name = dn
          x509_extensions = v3
          prompt = no
          [dn]
          CN = Developer ID Application: Unity Technologies ApS (SELFSIGNED)
          [v3]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          EOF
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -keyout k.pem -out c.pem -days 2 -config cert.cnf
          /usr/bin/openssl pkcs12 -export -inkey k.pem -in c.pem -out id.p12 -passout pass:pw
          security create-keychain -p pw forge.keychain
          security set-keychain-settings forge.keychain
          security unlock-keychain -p pw forge.keychain
          security list-keychains -d user -s forge.keychain $(security list-keychains -d user | tr -d '"')
          security import id.p12 -k forge.keychain -P pw -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k pw forge.keychain > /dev/null
          security find-identity forge.keychain
          HASH=$(security find-identity forge.keychain | grep -m1 -oE '[0-9A-F]{40}')
          codesign --force -s "$HASH" --keychain forge.keychain --identifier com.unity3d.UnityEditor5.x caseC_selfsigned/Unity.app

      - name: Results
        run: |
          cd "$RUNNER_TEMP"
          for c in caseA_unsigned caseB_adhoc caseC_selfsigned; do
            APP="$RUNNER_TEMP/$c/Unity.app"
            echo "=================== $c ==================="
            echo "--- codesign -dvvv (what Hub parses) ---"
            codesign -dvvv "$APP" 2>&1 || true
            echo "--- codesign --verify --deep --strict (real verification, Hub does not run this) ---"
            codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || echo "verify exit=$?"
            echo "--- spctl --assess (Gatekeeper) ---"
            spctl --assess --type execute -vv "$APP" 2>&1 || echo "spctl exit=$?"
            echo "--- Hub validateEditorFile logic ---"
            node "$RUNNER_TEMP/hubcheck.js" "$APP"
            echo "--- running the binary ---"
            "$APP/Contents/MacOS/Unity" || echo "exec exit=$?"
          done

      - name: Show the shipped Hub validator for comparison
        continue-on-error: true
        timeout-minutes: 8
        run: |
          cd "$RUNNER_TEMP"
          curl -L --max-time 240 -o hub.dmg "https://public-cdn.cloud.unity3d.com/hub/prod/UnityHubSetup-arm64.dmg"
          shasum -a 256 hub.dmg
          hdiutil attach hub.dmg -nobrowse -mountpoint "$RUNNER_TEMP/hubmnt"
          npx --yes @electron/asar extract "$RUNNER_TEMP/hubmnt/Unity Hub.app/Contents/Resources/app.asar" asar_out
          F=$(ls asar_out/.vite/build/editorUtils_darwin-*.js)
          echo "FILE: $F"
          grep -n "validateEditorFile" -A 40 "$F" | head -60
